name: Build Docker image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: mundial-2026
  REGISTRY: ghcr.io

jobs:
  docker-build:
    name: Build linux/amd64 Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version_tag: ${{ steps.tag.outputs.version_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        shell: bash
        run: |
          DATE_TAG=$(date -u +'%Y%m%d')
          RUN_NUMBER=${GITHUB_RUN_NUMBER}
          DAILY_SEQUENCE=$((RUN_NUMBER % 1000))
          VERSION_TAG="${DATE_TAG}.${DAILY_SEQUENCE}"

          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Generated tag: ${VERSION_TAG}"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.version_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Verify Azure secrets are configured
        id: precheck
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APP: ${{ secrets.AZURE_CONTAINER_APP }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ] || [ -z "$AZURE_SUBSCRIPTION_ID" ] || [ -z "$AZURE_RESOURCE_GROUP" ] || [ -z "$AZURE_CONTAINER_APP" ]; then
            echo "::warning::Azure secrets not fully configured on the production environment; skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Azure (OIDC)
        if: steps.precheck.outputs.configured == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        if: steps.precheck.outputs.configured == 'true'
        env:
          VERSION_TAG: ${{ needs.docker-build.outputs.version_tag }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINER_APP }}
        run: |
          az containerapp update \
            --name "$APP" \
            --resource-group "$RG" \
            --image "${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}:${VERSION_TAG}"

      - name: Smoke check
        if: steps.precheck.outputs.configured == 'true'
        env:
          RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APP: ${{ secrets.AZURE_CONTAINER_APP }}
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          echo "::add-mask::$FQDN"
          URL="https://${FQDN}/"
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL" -o /dev/null; then
              echo "Smoke check OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke check failed after 5 attempts"
          exit 1
